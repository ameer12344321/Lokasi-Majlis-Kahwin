<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Location</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  h1 {
    font-size: 22px;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  .address {
    font-size: 14px;
    color: #666;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s;
    color: white;
  }
  .btn:active { transform: scale(0.97); }
  .btn-gmaps {
    background: #4285F4;
    box-shadow: 0 4px 12px rgba(66,133,244,0.3);
  }
  .btn-waze {
    background: #33CCFF;
    box-shadow: 0 4px 12px rgba(51,204,255,0.3);
  }
  .icon { font-size: 22px; }
  .footer {
    margin-top: 16px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>📍 Open Location</h1>
    <p class="address">
      Lot 11 Lorong Cempaka,<br>
      Kampung Pasir Baru,<br>
      43500 Semenyih, Selangor
    </p>

    <a class="btn btn-gmaps" href="https://www.google.com/maps/search/?api=1&query=2.9976389,101.8734446">
      <span class="icon">🗺️</span>
      <span>Open in Google Maps</span>
    </a>

    <a class="btn btn-waze" href="https://waze.com/ul?ll=2.9976389,101.8734446&navigate=yes">
      <span class="icon">🚗</span>
      <span>Open in Waze</span>
    </a>

    <p class="footer">Tap your preferred app</p>
  </div>
</body>
</html>
